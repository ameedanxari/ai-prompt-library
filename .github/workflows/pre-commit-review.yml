name: Pre-Commit Review Enforcement

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  review-enforcement:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Check for debugging artifacts
      run: |
        echo "🔍 Checking for debugging artifacts..."
        
        # Check tracked, active Markdown for actionable debugging markers.
        # Use marker forms such as "TODO:" instead of broad substrings so
        # legitimate prompt examples like DEBUG flags or TEMPERATURE constants
        # do not fail the workflow.
        matches=$(
          git grep -nE '(^|[^[:alnum:]_])(TODO|FIXME|DEBUG|TEMP|XXX)[[:space:]]*(:|-)' -- \
            '*.md' \
            ':!docs/archive/**' \
            ':!prompts/outputs/**' \
            ':!prompts/working_copy/**' || true
        )

        if [ -n "$matches" ]; then
          echo "$matches"
          echo "❌ Found debugging artifacts in commit"
          echo "Please clean up before committing to production"
          exit 1
        fi
        
        # Check for empty files
        empty_files=$(
          git ls-files '*.md' | while IFS= read -r file; do
            if [ ! -s "$file" ]; then
              echo "$file"
            fi
          done
        )
        if [ -n "$empty_files" ]; then
          echo "$empty_files"
          echo "❌ Found empty markdown files"
          echo "Please remove empty files before committing"
          exit 1
        fi
        
        # Check for duplicate content
        if git ls-files '*.md' | sed 's#.*/##' | sort | uniq -d | grep -q .; then
          echo "⚠️ Warning: Found potential duplicate files"
        fi
        
        echo "✅ No debugging artifacts found"
    
    - name: Validate file structure
      run: |
        echo "🔍 Validating file structure..."
        
        # Check for proper organization
        if [ -d "prompts/orchestrators" ]; then
          echo "✅ Orchestrators directory exists"
        fi
        
        # Check for required documentation
        if [ ! -f "README.md" ]; then
          echo "❌ Missing README.md"
          exit 1
        fi
        
        if [ ! -f "docs/optional/PREVENTION_CHECKLIST.md" ]; then
          echo "❌ Missing docs/optional/PREVENTION_CHECKLIST.md"
          exit 1
        fi
        
        echo "✅ File structure validated"
    
    - name: Check commit message quality
      run: |
        echo "🔍 Checking commit message quality..."
        
        # Get the commit message
        COMMIT_MSG=$(git log -1 --pretty=%B)
        
        # Check for proper format
        if ! echo "$COMMIT_MSG" | grep -E "^(feat|fix|docs|style|refactor|test|chore):" > /dev/null; then
          echo "⚠️ Warning: Commit message doesn't follow conventional format"
        fi
        
        # Check for meaningful description
        if [ ${#COMMIT_MSG} -lt 20 ]; then
          echo "⚠️ Warning: Commit message is very short"
        fi
        
        echo "✅ Commit message checked"
