name: CI

# Phase 0 trust fix: this repo previously shipped with CI running a single
# untested script. This workflow runs the real gates on every push and PR:
# typecheck + build + the full vitest suite, and shellcheck over the
# scripts/ validators that the revise gate depends on.
# (Review-enforcement already has its own workflow: pre-commit-review.yml.)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh scripts/lib/*.sh
